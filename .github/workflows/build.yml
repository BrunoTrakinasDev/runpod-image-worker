name: R3C.9K Image Worker GHCR Publication Gate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type exactly: PUBLICAR R3C9K IMAGE WORKER NO GHCR'
        required: true
        type: string
      control_commit:
        description: 'Exact full commit SHA authorized for publication'
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Shared by all refs and reruns of this publication workflow.
concurrency:
  group: ghcr-runpod-image-worker-publication
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Controlled immutable publication
    runs-on: ubuntu-latest

    steps:
      - name: Validate publication authorization
        id: gate
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          CONTROL_COMMIT: ${{ inputs.control_commit }}
        run: |
          set -euo pipefail

          if [ "$CONFIRMATION" != "PUBLICAR R3C9K IMAGE WORKER NO GHCR" ]; then
            echo "Invalid confirmation phrase."
            exit 1
          fi

          if [[ ! "$CONTROL_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "control_commit must be an exact lowercase 40-character commit SHA."
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Publication is allowed only from main."
            exit 1
          fi

          SHORT_SHA="${CONTROL_COMMIT:0:12}"
          echo "control_commit=$CONTROL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          echo "PUBLICATION_GATE=PASS"
          echo "CONTROL_COMMIT=$CONTROL_COMMIT"
          echo "IMAGE_TAG=sha-$SHORT_SHA"

      - name: Checkout exact controlled commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.control_commit }}

      - name: Verify controlled checkout
        shell: bash
        env:
          CONTROL_COMMIT: ${{ steps.gate.outputs.control_commit }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$CONTROL_COMMIT" ]; then
            echo "CONTROLLED_CHECKOUT=BLOCKED"
            exit 1
          fi
          echo "CONTROLLED_CHECKOUT=PASS"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Reject existing or unverified GHCR tag
        timeout-minutes: 5
        shell: python
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROL_COMMIT: ${{ steps.gate.outputs.control_commit }}
        run: |
          import base64
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          REPOSITORY = "brunotrakinasdev/runpod-image-worker"
          MANIFEST_ACCEPT = ", ".join((
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          ))
          MAX_METADATA_BYTES = 1048576

          def require(condition):
              if not condition:
                  raise ValueError("Registry response cannot prove tag absence")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("Registry redirect rejected")

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result)
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError("Invalid JSON constant")

          def read_json(response, url):
              require(response.geturl() == url)
              require(response.headers.get_content_type() == "application/json")
              require(response.headers.get("Content-Encoding", "identity") == "identity")
              require(len(response.headers.get_all("Content-Type", [])) == 1)
              require(len(response.headers.get_all("Content-Encoding", [])) <= 1)
              require(len(response.headers.get_all("Content-Length", [])) <= 1)
              body = response.read(MAX_METADATA_BYTES + 1)
              require(len(body) <= MAX_METADATA_BYTES)
              length = response.headers.get("Content-Length")
              if length is not None:
                  require(length.isascii() and length.isdecimal() and int(length) == len(body))
              data = json.loads(body.decode("utf-8"), object_pairs_hook=unique_object, parse_constant=reject_constant)
              require(type(data) is dict)
              return data

          def get_token(opener, actor, credential):
              basic = base64.b64encode((actor + ":" + credential).encode()).decode()
              url = "https://ghcr.io/token?" + urllib.parse.urlencode({
                  "service": "ghcr.io", "scope": "repository:" + REPOSITORY + ":pull",
              })
              request = urllib.request.Request(url, headers={
                  "Authorization": "Basic " + basic, "Accept": "application/json",
                  "Accept-Encoding": "identity", "Cache-Control": "no-cache",
              })
              with opener.open(request, timeout=30) as response:
                  require(response.status == 200)
                  data = read_json(response, url)
                  require(response.headers.get("Link") is None)
              token = data.get("token", data.get("access_token"))
              require(isinstance(token, str) and bool(token))
              require(re.fullmatch(r"[A-Za-z0-9._~+/=-]+", token))
              require("access_token" not in data or data["access_token"] == token)
              return token

          def probe_exact_manifest(opener, candidate, token):
              url = "https://ghcr.io/v2/" + REPOSITORY + "/manifests/" + candidate
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token, "Accept": MANIFEST_ACCEPT,
                  "Accept-Encoding": "identity", "Cache-Control": "no-cache",
              })
              try:
                  response = opener.open(request, timeout=30)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  # Any 200 blocks immediately, regardless of body or content type.
                  if response.status == 200:
                      return "BLOCK_EXISTING_TAG"
                  require(response.status == 404)
                  data = read_json(response, url)
              require(set(data) == {"errors"})
              errors = data["errors"]
              require(type(errors) is list and bool(errors))
              require(all(
                  type(error) is dict
                  and set(error) <= {"code", "message", "detail"}
                  and error.get("code") == "MANIFEST_UNKNOWN"
                  and isinstance(error.get("message"), str)
                  and bool(error["message"].strip())
                  for error in errors
              ))
              return "ALLOW_ABSENCE_PROVEN"

          def preflight(opener, actor, credential, control_commit):
              try:
                  require(bool(actor) and bool(credential))
                  require(isinstance(control_commit, str) and re.fullmatch(r"[0-9a-f]{40}", control_commit))
                  candidate = "sha-" + control_commit[:12]
                  token = get_token(opener, actor, credential)
                  return probe_exact_manifest(opener, candidate, token)
              except Exception:
                  # Never emit credentials, response bodies, exception details or URLs.
                  return "BLOCK_UNPROVEN"

          if __name__ == "__main__":
              result = preflight(
                  urllib.request.build_opener(NoRedirect()),
                  os.environ.get("GITHUB_ACTOR", ""),
                  os.environ.get("GHCR_TOKEN", ""),
                  os.environ.get("CONTROL_COMMIT", ""),
              )
              if result != "ALLOW_ABSENCE_PROVEN":
                  raise SystemExit("GHCR_PREFLIGHT=" + result)
              print("GHCR_PREFLIGHT=PASS (exact tag absence proven)")

      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/brunotrakinasdev/runpod-image-worker:sha-${{ steps.gate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.gate.outputs.control_commit }}

      - name: Record immutable digest
        shell: bash
        env:
          CONTROL_COMMIT: ${{ steps.gate.outputs.control_commit }}
        run: |
          set -euo pipefail

          echo "## R3C.9K immutable image publication" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$CONTROL_COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`sha-${{ steps.gate.outputs.short_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

          echo "GHCR_PUBLICATION=PASS"
          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}"