name: R3C.9K Image Worker GHCR Publication Gate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type exactly: PUBLICAR R3C9K IMAGE WORKER NO GHCR'
        required: true
        type: string
      control_commit:
        description: 'Exact full commit SHA authorized for publication'
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Shared by all refs and reruns of this publication workflow.
concurrency:
  group: ghcr-runpod-image-worker-publication
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Controlled immutable publication
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact selected ref
        uses: actions/checkout@v4

      - name: Validate publication authorization
        id: gate
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          CONTROL_COMMIT: ${{ inputs.control_commit }}
        run: |
          set -euo pipefail

          if [ "$CONFIRMATION" != "PUBLICAR R3C9K IMAGE WORKER NO GHCR" ]; then
            echo "Invalid confirmation phrase."
            exit 1
          fi

          if [ "$CONTROL_COMMIT" != "$GITHUB_SHA" ]; then
            echo "control_commit does not match GITHUB_SHA."
            echo "Expected: $GITHUB_SHA"
            echo "Received: $CONTROL_COMMIT"
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Publication is allowed only from main."
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA:0:12}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          echo "PUBLICATION_GATE=PASS"
          echo "CONTROL_COMMIT=$GITHUB_SHA"
          echo "IMAGE_TAG=sha-$SHORT_SHA"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Reject existing or unverified GHCR tag
        timeout-minutes: 5
        shell: python
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import base64
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          REPOSITORY = "brunotrakinasdev/runpod-image-worker"
          PATH = "/v2/" + REPOSITORY + "/tags/list"
          BASE = "https://ghcr.io" + PATH
          PAGE_SIZE = 100

          def require(condition):
              if not condition:
                  raise ValueError("Registry response cannot prove tag absence")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("Registry redirect rejected")

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result)
                  result[key] = value
              return result

          def get_json(opener, url, authorization):
              request = urllib.request.Request(url, headers={
                  "Authorization": authorization, "Accept": "application/json",
                  "Accept-Encoding": "identity", "Cache-Control": "no-cache",
              })
              with opener.open(request, timeout=30) as response:
                  require(response.status == 200 and response.geturl() == url)
                  require(response.headers.get_content_type() == "application/json")
                  require(response.headers.get("Content-Encoding", "identity") == "identity")
                  require(len(response.headers.get_all("Link", [])) <= 1)
                  require(len(response.headers.get_all("Content-Length", [])) <= 1)
                  body = response.read(1048577)
                  require(len(body) <= 1048576)
                  length = response.headers.get("Content-Length")
                  if length is not None:
                      require(length.isascii() and length.isdecimal() and int(length) == len(body))
                  data = json.loads(body.decode("utf-8"), object_pairs_hook=unique_object)
                  require(type(data) is dict)
                  return data, response.headers.get("Link")

          def preflight(opener, actor, credential, sha):
              require(bool(actor) and bool(credential) and re.fullmatch(r"[0-9a-f]{40}", sha))
              candidate = "sha-" + sha[:12]
              basic = base64.b64encode((actor + ":" + credential).encode()).decode()
              token_url = "https://ghcr.io/token?" + urllib.parse.urlencode({
                  "service": "ghcr.io", "scope": "repository:" + REPOSITORY + ":pull",
              })
              data, link = get_json(opener, token_url, "Basic " + basic)
              token = data.get("token", data.get("access_token"))
              require(link is None and isinstance(token, str) and bool(token))
              require(re.fullmatch(r"[A-Za-z0-9._~+/=-]+", token))
              require("access_token" not in data or data["access_token"] == token)
              url, last = BASE + "?n=100", ""
              for _ in range(1000):
                  data, link = get_json(opener, url, "Bearer " + token)
                  require(data.get("name") == REPOSITORY and "tags" in data and "errors" not in data)
                  tags = data["tags"]
                  require(type(tags) is list and len(tags) <= PAGE_SIZE)
                  require(all(isinstance(t, str) and re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}", t) for t in tags))
                  require(tags == sorted(set(tags)) and all(t > last for t in tags))
                  if candidate in tags:
                      raise ValueError("Candidate tag already exists; publication blocked")
                  if link is not None:
                      match = re.fullmatch(r'\s*<([^<>]+)>;\s*rel="next"\s*', link)
                      require(match is not None and bool(tags))
                      next_url = urllib.parse.urljoin(url, match[1])
                      parsed = urllib.parse.urlsplit(next_url)
                      require(parsed.scheme == "https" and parsed.netloc == "ghcr.io")
                      require(parsed.path == PATH and not parsed.fragment)
                      query = urllib.parse.parse_qs(parsed.query, strict_parsing=True)
                      require(query == {"n": ["100"], "last": [tags[-1]]})
                      url = next_url
                  elif len(tags) == PAGE_SIZE:
                      # A full page without Link is not proof of completion.
                      url = BASE + "?" + urllib.parse.urlencode({"n": 100, "last": tags[-1]})
                  else:
                      return candidate
                  last = tags[-1]
              raise ValueError("Pagination limit reached; publication blocked")

          if __name__ == "__main__":
              try:
                  preflight(urllib.request.build_opener(NoRedirect()), os.environ["GITHUB_ACTOR"],
                            os.environ["GHCR_TOKEN"], os.environ["GITHUB_SHA"])
              except Exception:
                  # Never emit credentials, response bodies, or exception URLs.
                  raise SystemExit("GHCR_PREFLIGHT=BLOCKED (existing tag or unproven absence)") from None
              print("GHCR_PREFLIGHT=PASS")

      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/brunotrakinasdev/runpod-image-worker:sha-${{ steps.gate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record immutable digest
        shell: bash
        run: |
          set -euo pipefail

          echo "## R3C.9K immutable image publication" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`sha-${{ steps.gate.outputs.short_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

          echo "GHCR_PUBLICATION=PASS"
          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}"