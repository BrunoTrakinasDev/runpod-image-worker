name: R3C.9K Image Worker GHCR Publication Gate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type exactly: PUBLICAR R3C9K IMAGE WORKER NO GHCR'
        required: true
        type: string
      control_commit:
        description: 'Exact full commit SHA authorized for publication'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Controlled immutable publication
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact selected ref
        uses: actions/checkout@v4

      - name: Validate publication authorization
        id: gate
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          CONTROL_COMMIT: ${{ inputs.control_commit }}
        run: |
          set -euo pipefail

          if [ "$CONFIRMATION" != "PUBLICAR R3C9K IMAGE WORKER NO GHCR" ]; then
            echo "Invalid confirmation phrase."
            exit 1
          fi

          if [ "$CONTROL_COMMIT" != "$GITHUB_SHA" ]; then
            echo "control_commit does not match GITHUB_SHA."
            echo "Expected: $GITHUB_SHA"
            echo "Received: $CONTROL_COMMIT"
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Publication is allowed only from main."
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA:0:12}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          echo "PUBLICATION_GATE=PASS"
          echo "CONTROL_COMMIT=$GITHUB_SHA"
          echo "IMAGE_TAG=sha-$SHORT_SHA"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/runpod-image-worker:sha-${{ steps.gate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record immutable digest
        shell: bash
        run: |
          set -euo pipefail

          echo "## R3C.9K immutable image publication" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`sha-${{ steps.gate.outputs.short_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

          echo "GHCR_PUBLICATION=PASS"
          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}"